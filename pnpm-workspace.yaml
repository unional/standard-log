packages:
  - packages/*
  - examples/*
allowBuilds:
  core-js: true
  esbuild: true
  fsevents: true
# Supply-chain soak: refuse any package version published less than 24h ago.
# `minimumReleaseAgeStrict` is what makes it a control rather than a suggestion — without it
# pnpm's default behaviour on meeting a too-young package is to append that package to
# `minimumReleaseAgeExclude` and carry on, silently weakening the policy it just enforced.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

# First-party packages are exempt from the soak.
#
# The soak exists to stop a COMPROMISED THIRD-PARTY release being pulled into a build
# within hours of publication. It does not describe our own packages: we control what
# goes into them, and a first-party release is reviewed before it is published, not
# after. Applying it to ourselves only means a fresh publish is invisible to the next
# repo in the chain for 24h.
minimumReleaseAgeExclude:
  - assertron
  - satisfier
  - tersify
  - unpartial
  - type-plus
  - path-equal
  - iso-error
  - iso-error-web
  - iso-error-google-cloud-api
  - google-cloud-api
  - standard-log
  - standard-log-color
  - async-fp
  - fsa-emitter
  - progress-str
  - clibuilder
  - args-minus
  - global-store
  - stable-store
  - mocktomata
  - just-func
  - storybook-addon-vis
  - vitest-plugin-vis
  - node-supported-releases
  - '@just-func/*'
  - '@just-web/*'
  - '@mocktomata/*'
  - '@repobuddy/*'
  - '@unional/*'
