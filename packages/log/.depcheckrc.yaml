ignore-patterns:
  - cjs
  - dist
  - esm
ignores:
  # Listed one package per line, never as a wildcard: a blanket pattern hides dead
  # dependencies rather than declaring intentional ones.
  - depcheck # bin-only, invoked from the depcheck script
  - rimraf # https://github.com/depcheck/depcheck/issues/776
  - tsdown # bin-only, configured by tsdown.config.ts
  - typescript # bin-only, `tsc` in the typecheck script
